context:
  initializer:
    classes: com.krishi.backend.config.TestDatabaseInitializer

server:
  port: 0

spring:
  datasource:
    url: ${SPRING_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/krishi_test_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    default-schema: krishi
    schemas: krishi

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
